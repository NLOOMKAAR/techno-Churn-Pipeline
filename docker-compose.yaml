# Local integration-test harness for the cloud-native API. Mirrors what the
# Dockerfile/entrypoint.sh do in a real deployment, letting you exercise
# config overrides, health probes and volumes before pushing to a cluster.
services:
  churn-api:
    build: .
    image: telco-churn-dataops-pipeline:local
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      ENVIRONMENT: "dev"
      LOG_LEVEL: "INFO"
      LOG_FORMAT: "text"
      CORS_ORIGINS: "*"
      ENABLE_EMBEDDED_SCHEDULER: "true"
    volumes:
      - churn-logs:/app/logs
      - churn-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  churn-logs:
  churn-data:
